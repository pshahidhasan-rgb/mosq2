<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Khutbah TV Display — Mishkah AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --emerald: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.4);
      --gold: #f59e0b;
      --gold-light: #fef08a;
      --bg: #030711;
      --divider: rgba(255, 255, 255, 0.08);
      --text-muted: rgba(255, 255, 255, 0.38);
      --tv-font-scale: 1;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: #fff;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* ─── TOP BAR (Clean & Sleek) ─── */
    #topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 72px;
      background: rgba(3, 7, 17, 0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      z-index: 100;
    }

    /* Left Source Language Dropdown */
    .source-dropdown-wrapper {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      padding: 0.25rem 0.85rem 0.25rem 0.75rem;
      transition: all 0.2s;
    }
    .source-dropdown-wrapper:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.35);
    }

    .source-mic-icon {
      font-size: 0.85rem;
      opacity: 0.85;
      line-height: 1;
      display: flex;
      align-items: center;
    }

    .source-select-dropdown {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.9);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      outline: none;
    }
    .source-select-dropdown option {
      background: #0b1523;
      color: #f1f5f9;
      font-size: 0.9rem;
    }

    /* Center Mosque Brand & Layout Switcher */
    .center-brand-wrapper {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.28rem; /* a little below the name to separate them */
      pointer-events: auto;
    }

    .center-brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .brand-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: #10b981;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 0.95rem;
      color: #030711;
      box-shadow: 0 0 12px var(--emerald-glow);
    }

    #mosque-name {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #f8fafc;
      line-height: 1.2;
      white-space: nowrap;
    }

    /* Screen Mode Dropdown (Dual Screen vs Translation Only) */
    .screen-mode-dropdown-wrapper {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      padding: 0.15rem 0.65rem;
      transition: all 0.2s;
    }
    .screen-mode-dropdown-wrapper:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.38);
    }
    .screen-icon {
      font-size: 0.78rem;
      line-height: 1;
      display: flex;
      align-items: center;
      opacity: 0.85;
    }
    .screen-select-dropdown {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.92);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }
    .screen-select-dropdown option {
      background: #0b1523;
      color: #f1f5f9;
      font-size: 0.85rem;
    }

    /* Right Controls: Target Language & Fullscreen */
    .right-controls-wrapper {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    /* Right Target Language Dropdown */
    .lang-dropdown-wrapper {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 999px;
      padding: 0.25rem 0.85rem 0.25rem 0.65rem;
      transition: all 0.2s;
    }
    .lang-dropdown-wrapper:hover {
      background: rgba(16, 185, 129, 0.2);
      border-color: rgba(16, 185, 129, 0.6);
    }

    .live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #10b981;
      animation: pulse 1.5s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.75); } }

    .lang-select-dropdown {
      background: transparent;
      border: none;
      color: #34d399;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      outline: none;
    }
    .lang-select-dropdown option {
      background: #0a1f17;
      color: #f1f5f9;
      font-size: 0.9rem;
    }

    /* ─── SCREEN MODE: TRANSLATION ONLY (Option 2) ─── */
    body.screen-mode-trans-only #arabic-col {
      display: none !important;
    }
    body.screen-mode-trans-only #trans-col {
      flex: 1 1 100% !important;
      max-width: 100% !important;
      border: none !important;
      padding: 2.5rem 5rem 13rem !important;
      background: radial-gradient(circle at 50% 90%, rgba(59, 130, 246, 0.03) 0%, transparent 70%);
    }
    body.screen-mode-trans-only #trans-col .feed-container {
      max-width: 1100px;
      margin-left: auto;
      margin-right: auto;
    }

    /* ─── MAIN STAGE: 2 SPLIT COLUMNS ─── */
    #stage {
      position: fixed;
      top: 72px; bottom: 0; left: 0; right: 0;
      display: flex;
    }

    .split-col {
      flex: 1;
      height: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .split-col::-webkit-scrollbar {
      display: none;
    }

    /* Left Side: Arabic — 13rem bottom clearance to match translation column exactly */
    #arabic-col {
      border-right: 1px solid var(--divider);
      direction: rtl;
      padding: 2rem 3rem 13rem;
      background: radial-gradient(circle at 10% 90%, rgba(16, 185, 129, 0.03) 0%, transparent 60%);
    }

    /* Right Side: Translation — Protected with 13rem (~208px) bottom clearance so text NEVER collides with QR code */
    #trans-col {
      direction: ltr;
      padding: 2rem 3rem 13rem;
      background: radial-gradient(circle at 90% 90%, rgba(59, 130, 246, 0.02) 0%, transparent 60%);
    }

    /* Content Scrolling Feed */
    .feed-container {
      display: flex;
      flex-direction: column;
      gap: calc(1.15rem * var(--tv-font-scale, 1));
      width: 100%;
      margin-top: auto;
      transition: transform 0.4s ease;
    }

    /* ─── PROPORTIONAL TYPOGRAPHY (Dynamically Scaled & Balanced) ─── */
    .para-item {
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      color: #ffffff;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.22);
    }

    /* Arabic Column Typography */
    #arabic-col .para-item {
      font-family: 'Amiri', serif;
      line-height: 1.6;
      text-align: right;
      color: #ffffff;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.22);
    }
    #arabic-col .para-item.history {
      font-size: calc(clamp(1.1rem, 1.5vw, 1.45rem) * var(--tv-font-scale, 1));
      color: #ffffff;
      font-weight: 500;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.22);
    }
    #arabic-col .para-item.current {
      font-size: calc(clamp(1.4rem, 2.1vw, 2rem) * var(--tv-font-scale, 1));
      color: #ffffff;
      font-weight: 700;
      text-shadow: 0 0 28px rgba(255, 255, 255, 0.28);
      animation: textGlowIn 0.4s ease;
    }

    /* Translation Column Typography */
    #trans-col .para-item {
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.45;
      text-align: left;
      color: #ffffff;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.22);
    }
    #trans-col .para-item.history {
      font-size: calc(clamp(0.95rem, 1.25vw, 1.2rem) * var(--tv-font-scale, 1));
      color: #ffffff;
      font-weight: 500;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.22);
    }
    #trans-col .para-item.current {
      font-size: calc(clamp(1.2rem, 1.7vw, 1.65rem) * var(--tv-font-scale, 1));
      color: #ffffff;
      font-weight: 600;
      text-shadow: 0 0 28px rgba(255, 255, 255, 0.28);
      animation: textGlowIn 0.4s ease;
    }

    @keyframes textGlowIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Word-by-Word Live Streaming Typewriter Styles */
    .stream-word {
      display: inline;
      animation: wordFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes wordFadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .para-item.streaming::after {
      content: ' ▍';
      color: #10b981;
      font-size: 0.75em;
      display: inline-block;
      vertical-align: middle;
      animation: blinkCursor 0.75s infinite ease-in-out;
    }
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Translating placeholder: shown on the translation column while Arabic
       is actively streaming but translation tokens haven't arrived yet */
    .translating-placeholder {
      opacity: 0.35;
      font-style: italic;
      animation: pulseTranslate 1.5s ease-in-out infinite;
    }
    .translating-placeholder::after {
      content: '' !important;  /* suppress the blinkCursor on placeholder */
    }
    @keyframes pulseTranslate {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.5; }
    }

    .idle-placeholder {
      color: rgba(255, 255, 255, 0.25);
      font-style: italic;
      text-align: center;
      margin: auto 0;
      font-size: 1.15rem;
    }

    /* Never show "waiting for sermon/ceremony to begin" text when session is live */
    body.session-active .idle-placeholder {
      display: none !important;
    }

    /* ─── BOTTOM RIGHT QR CODE WIDGET (Fixed Coordinates & Safeguarded) ─── */
    #qr-widget {
      position: fixed;
      bottom: 1.5rem;
      right: 2rem;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(10, 20, 32, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 0.55rem 0.65rem 0.45rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      width: 130px;
    }

    .qr-frame {
      background: #ffffff;
      padding: 0.3rem;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qr-img {
      width: 100px;
      height: 100px;
      display: block;
      image-rendering: pixelated;
    }

    .qr-caption {
      margin-top: 0.45rem;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.85);
      text-align: center;
    }

    /* ─── FULLSCREEN QURAN AYAH OVERLAY (Scaled Elegantly) ─── */
    #ayah-overlay {
      display: none;
      position: fixed;
      inset: 72px 0 0 0;
      z-index: 150;
      background: rgba(3, 7, 17, 0.96);
      backdrop-filter: blur(20px);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 5rem;
      text-align: center;
    }
    #ayah-overlay.active {
      display: flex;
      animation: fadeIn 0.35s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .ayah-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #030711;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.35rem 1rem;
      border-radius: 999px;
      margin-bottom: 1rem;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
    }

    #ayah-reference {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--gold-light);
      margin-bottom: 1.5rem;
      letter-spacing: 0.04em;
    }

    #ayah-arabic {
      font-family: 'Amiri', serif;
      font-size: clamp(1.8rem, 3.2vw, 2.8rem);
      line-height: 1.65;
      direction: rtl;
      color: #fef08a;
      text-shadow: 0 0 35px rgba(245, 158, 11, 0.35);
      margin-bottom: 1.5rem;
      max-width: 1000px;
    }

    #ayah-trans {
      font-size: clamp(1.15rem, 1.8vw, 1.55rem);
      font-weight: 500;
      font-style: italic;
      color: rgba(255, 255, 255, 0.88);
      max-width: 900px;
      line-height: 1.5;
    }

    /* Fullscreen Toggle (Integrated into Right Controls) */
    #btn-fullscreen {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.28rem 0.75rem;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      white-space: nowrap;
    }
    #btn-fullscreen:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.38);
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header id="topbar">
    <!-- Left: Source (Speech) Language Dropdown -->
    <div class="source-dropdown-wrapper">
      <span class="source-mic-icon" title="Source Language">🎙️</span>
      <select id="source-lang-select" class="source-select-dropdown" aria-label="Select TV Source Language">
        <option value="auto">Detect Any</option>
        <option value="ar">Arabic (العربية)</option>
        <option value="en">English</option>
        <option value="uz">Uzbek (O‘zbekcha)</option>
        <option value="tr">Turkish (Türkçe)</option>
        <option value="ur">Urdu (اردو)</option>
        <option value="bn">Bengali (বাংলা)</option>
        <option value="fr">French (Français)</option>
        <option value="zh">Chinese Mandarin (中文 普通话)</option>
        <option value="zh-TW">Traditional Chinese (中文 繁體)</option>
        <option value="id">Indonesian (Bahasa)</option>
        <option value="so">Somali (Soomaali)</option>
      </select>
    </div>

    <!-- Center: Mosque Brand & Screen Layout Switcher (Separated a little below the name) -->
    <div class="center-brand-wrapper">
      <div class="center-brand">
        <div class="brand-icon">🕌</div>
        <div id="mosque-name">MYO YOUTH CENTER</div>
      </div>
      <div class="screen-mode-dropdown-wrapper">
        <span class="screen-icon" title="Screen Layout">🖥️</span>
        <select id="screen-mode-select" class="screen-select-dropdown" aria-label="Select Screen Layout">
          <option value="split">Dual Screen (Split)</option>
          <option value="translation-only">Translation Only</option>
        </select>
      </div>
    </div>

    <!-- Right Controls: Translation Language & Fullscreen -->
    <div class="right-controls-wrapper">
      <div class="lang-dropdown-wrapper">
        <span class="live-dot" id="live-dot-indicator"></span>
        <select id="target-lang-select" class="lang-select-dropdown" aria-label="Select TV Translation Language">
          <option value="en">English</option>
          <option value="uz">Uzbek (O‘zbekcha)</option>
          <option value="tr">Turkish (Türkçe)</option>
          <option value="ur">Urdu (اردو)</option>
          <option value="bn">Bengali (বাংলা)</option>
          <option value="fr">French (Français)</option>
          <option value="zh">Chinese Mandarin (中文 普通话)</option>
          <option value="zh-TW">Traditional Chinese (中文 繁體)</option>
          <option value="id">Indonesian (Bahasa)</option>
          <option value="so">Somali (Soomaali)</option>
        </select>
      </div>

      <!-- Fullscreen Button -->
      <button id="btn-fullscreen" onclick="toggleFullscreen()" title="Toggle Fullscreen">⛶ Fullscreen</button>
    </div>
  </header>

  <!-- Floating Status Banner (Paused / Ended state) -->
  <div id="stage-status-banner" style="display: none; position: fixed; top: 84px; left: 50%; transform: translateX(-50%); z-index: 95; padding: 0.35rem 1.25rem; border-radius: 999px; font-size: 0.84rem; font-weight: 700; letter-spacing: 0.04em; backdrop-filter: blur(12px); box-shadow: 0 4px 20px rgba(0,0,0,0.5);">
    <span id="stage-status-text">Translation Paused</span>
  </div>

  <!-- Split Screen Stage -->
  <main id="stage">
    <!-- Left Column: Arabic Stream -->
    <section class="split-col" id="arabic-col">
      <div class="feed-container" id="arabic-feed">
        <div class="idle-placeholder">في انتظار بدء الخطبة...</div>
      </div>
    </section>

    <!-- Right Column: Translation Stream (with 13rem bottom clearance for QR code) -->
    <section class="split-col" id="trans-col">
      <div class="feed-container" id="trans-feed">
        <div class="idle-placeholder">Waiting for sermon to begin...</div>
      </div>
    </section>
  </main>

  <!-- Bottom Right QR Widget: "LISTEN ON YOUR PHONE" (Safeguarded Coordinates) -->
  <aside id="qr-widget" title="Scan to open translation on your phone">
    <div class="qr-frame">
      <img id="qr-img" src="" alt="Scan QR to listen on phone" />
    </div>
    <div class="qr-caption">LISTEN ON YOUR PHONE</div>
    <div style="font-size: 0.52rem; font-weight: 700; color: rgba(255, 255, 255, 0.4); margin-top: 0.25rem; letter-spacing: 0.06em; text-transform: uppercase;">Mishkah AI</div>
  </aside>

  <!-- Quran Ayah Fullscreen Overlay — DISABLED -->
  <div id="ayah-overlay" style="display:none !important;">
    <div class="ayah-badge">📖 Holy Quran</div>
    <div id="ayah-reference">Surah Ali 'Imran (3:102)</div>
    <div id="ayah-arabic" dir="rtl"></div>
    <div id="ayah-trans"></div>
  </div>

  <script src="display.js"></script>
</body>
</html>
