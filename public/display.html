<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Khutbah TV Display — MosqAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --emerald: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.4);
      --gold: #f59e0b;
      --gold-light: #fef08a;
      --bg: #030711;
      --divider: rgba(255, 255, 255, 0.08);
      --text-muted: rgba(255, 255, 255, 0.38);
      --tv-font-scale: 1;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: #fff;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* ─── TOP BAR (Clean & Sleek) ─── */
    #topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 64px;
      background: rgba(3, 7, 17, 0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2.5rem;
      z-index: 100;
    }

    /* Left Language Pill */
    .pill-source {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.35rem 1rem;
      border-radius: 999px;
      letter-spacing: 0.04em;
    }

    /* Center Mosque Brand */
    .center-brand {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: #10b981;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.1rem;
      color: #030711;
      box-shadow: 0 0 15px var(--emerald-glow);
    }

    #mosque-name {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #f8fafc;
    }

    /* Right Target Language Dropdown */
    .lang-dropdown-wrapper {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 999px;
      padding: 0.25rem 0.85rem 0.25rem 0.65rem;
      margin-right: 7.5rem; /* Shift left to prevent overlap with Fullscreen button */
      transition: all 0.2s;
    }
    .lang-dropdown-wrapper:hover {
      background: rgba(16, 185, 129, 0.2);
      border-color: rgba(16, 185, 129, 0.6);
    }

    .live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #10b981;
      animation: pulse 1.5s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.75); } }

    .lang-select-dropdown {
      background: transparent;
      border: none;
      color: #34d399;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      outline: none;
    }
    .lang-select-dropdown option {
      background: #0a1f17;
      color: #f1f5f9;
      font-size: 0.9rem;
    }

    /* ─── MAIN STAGE: 2 SPLIT COLUMNS ─── */
    #stage {
      position: fixed;
      top: 64px; bottom: 0; left: 0; right: 0;
      display: flex;
    }

    .split-col {
      flex: 1;
      height: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .split-col::-webkit-scrollbar {
      display: none;
    }

    /* Left Side: Arabic — 13rem bottom clearance to match translation column exactly */
    #arabic-col {
      border-right: 1px solid var(--divider);
      direction: rtl;
      padding: 2rem 3rem 13rem;
      background: radial-gradient(circle at 10% 90%, rgba(16, 185, 129, 0.03) 0%, transparent 60%);
    }

    /* Right Side: Translation — Protected with 13rem (~208px) bottom clearance so text NEVER collides with QR code */
    #trans-col {
      direction: ltr;
      padding: 2rem 3rem 13rem;
      background: radial-gradient(circle at 90% 90%, rgba(59, 130, 246, 0.02) 0%, transparent 60%);
    }

    /* Content Scrolling Feed */
    .feed-container {
      display: flex;
      flex-direction: column;
      gap: calc(1.15rem * var(--tv-font-scale, 1));
      width: 100%;
      margin-top: auto;
      transition: transform 0.4s ease;
    }

    /* ─── PROPORTIONAL TYPOGRAPHY (Dynamically Scaled & Balanced) ─── */
    .para-item {
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Arabic Column Typography */
    #arabic-col .para-item {
      font-family: 'Amiri', serif;
      line-height: 1.6;
      text-align: right;
    }
    #arabic-col .para-item.history {
      font-size: calc(clamp(1.1rem, 1.5vw, 1.45rem) * var(--tv-font-scale, 1));
      color: rgba(255, 255, 255, 0.52);
      font-weight: 400;
    }
    #arabic-col .para-item.current {
      font-size: calc(clamp(1.4rem, 2.1vw, 2rem) * var(--tv-font-scale, 1));
      color: #ffffff;
      font-weight: 700;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
      animation: textGlowIn 0.4s ease;
    }

    /* Translation Column Typography */
    #trans-col .para-item {
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.45;
      text-align: left;
    }
    #trans-col .para-item.history {
      font-size: calc(clamp(0.95rem, 1.25vw, 1.2rem) * var(--tv-font-scale, 1));
      color: rgba(255, 255, 255, 0.52);
      font-weight: 400;
    }
    #trans-col .para-item.current {
      font-size: calc(clamp(1.2rem, 1.7vw, 1.65rem) * var(--tv-font-scale, 1));
      color: #ffffff;
      font-weight: 600;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
      animation: textGlowIn 0.4s ease;
    }

    @keyframes textGlowIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Word-by-Word Live Streaming Typewriter Styles */
    .stream-word {
      display: inline;
      animation: wordFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes wordFadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .para-item.streaming::after {
      content: ' ▍';
      color: #10b981;
      font-size: 0.75em;
      display: inline-block;
      vertical-align: middle;
      animation: blinkCursor 0.75s infinite ease-in-out;
    }
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .idle-placeholder {
      color: rgba(255, 255, 255, 0.25);
      font-style: italic;
      text-align: center;
      margin: auto 0;
      font-size: 1.15rem;
    }

    /* ─── BOTTOM RIGHT QR CODE WIDGET (Fixed Coordinates & Safeguarded) ─── */
    #qr-widget {
      position: fixed;
      bottom: 1.5rem;
      right: 2rem;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(10, 20, 32, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 0.55rem 0.65rem 0.45rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      width: 130px;
    }

    .qr-frame {
      background: #ffffff;
      padding: 0.3rem;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qr-img {
      width: 100px;
      height: 100px;
      display: block;
      image-rendering: pixelated;
    }

    .qr-caption {
      margin-top: 0.45rem;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.85);
      text-align: center;
    }

    /* ─── FULLSCREEN QURAN AYAH OVERLAY (Scaled Elegantly) ─── */
    #ayah-overlay {
      display: none;
      position: fixed;
      inset: 64px 0 0 0;
      z-index: 150;
      background: rgba(3, 7, 17, 0.96);
      backdrop-filter: blur(20px);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 5rem;
      text-align: center;
    }
    #ayah-overlay.active {
      display: flex;
      animation: fadeIn 0.35s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .ayah-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #030711;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.35rem 1rem;
      border-radius: 999px;
      margin-bottom: 1rem;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
    }

    #ayah-reference {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--gold-light);
      margin-bottom: 1.5rem;
      letter-spacing: 0.04em;
    }

    #ayah-arabic {
      font-family: 'Amiri', serif;
      font-size: clamp(1.8rem, 3.2vw, 2.8rem);
      line-height: 1.65;
      direction: rtl;
      color: #fef08a;
      text-shadow: 0 0 35px rgba(245, 158, 11, 0.35);
      margin-bottom: 1.5rem;
      max-width: 1000px;
    }

    #ayah-trans {
      font-size: clamp(1.15rem, 1.8vw, 1.55rem);
      font-weight: 500;
      font-style: italic;
      color: rgba(255, 255, 255, 0.88);
      max-width: 900px;
      line-height: 1.5;
    }

    /* Fullscreen Toggle */
    #btn-fullscreen {
      position: fixed;
      top: 16px;
      right: 1.25rem;
      z-index: 250;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.78rem;
      padding: 0.3rem 0.65rem;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    #btn-fullscreen:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header id="topbar">
    <!-- Left: Source Language Indicator -->
    <div class="pill-source">Arabic</div>

    <!-- Center: Mosque / Center Branding -->
    <div class="center-brand">
      <div class="brand-icon">🕌</div>
      <div id="mosque-name">MYO YOUTH CENTER</div>
      <span id="session-status-badge" style="font-size: 0.72rem; font-weight: 800; padding: 0.2rem 0.6rem; border-radius: 999px; letter-spacing: 0.05em; background: rgba(148, 163, 184, 0.15); border: 1px solid rgba(148, 163, 184, 0.3); color: #94a3b8;">IDLE</span>
    </div>

    <!-- Right: Translation Language Dropdown -->
    <div class="lang-dropdown-wrapper">
      <span class="live-dot" id="live-dot-indicator"></span>
      <select id="target-lang-select" class="lang-select-dropdown" aria-label="Select TV Translation Language">
        <option value="en">English</option>
        <option value="uz">Uzbek (O‘zbekcha)</option>
        <option value="tr">Turkish (Türkçe)</option>
        <option value="ur">Urdu (اردو)</option>
        <option value="bn">Bengali (বাংলা)</option>
        <option value="fr">French (Français)</option>
        <option value="zh">Chinese Mandarin (中文 普通话)</option>
        <option value="zh-TW">Traditional Chinese (中文 繁體)</option>
        <option value="id">Indonesian (Bahasa)</option>
        <option value="so">Somali (Soomaali)</option>
      </select>
    </div>
  </header>

  <!-- Fullscreen Button -->
  <button id="btn-fullscreen" onclick="toggleFullscreen()">⛶ Fullscreen</button>

  <!-- Floating Status Banner (Paused / Ended state) -->
  <div id="stage-status-banner" style="display: none; position: fixed; top: 76px; left: 50%; transform: translateX(-50%); z-index: 95; padding: 0.35rem 1.25rem; border-radius: 999px; font-size: 0.84rem; font-weight: 700; letter-spacing: 0.04em; backdrop-filter: blur(12px); box-shadow: 0 4px 20px rgba(0,0,0,0.5);">
    <span id="stage-status-text">Translation Paused</span>
  </div>

  <!-- Split Screen Stage -->
  <main id="stage">
    <!-- Left Column: Arabic Stream -->
    <section class="split-col" id="arabic-col">
      <div class="feed-container" id="arabic-feed">
        <div class="idle-placeholder">في انتظار بدء الخطبة...</div>
      </div>
    </section>

    <!-- Right Column: Translation Stream (with 13rem bottom clearance for QR code) -->
    <section class="split-col" id="trans-col">
      <div class="feed-container" id="trans-feed">
        <div class="idle-placeholder">Waiting for sermon to begin...</div>
      </div>
    </section>
  </main>

  <!-- Bottom Right QR Widget: "LISTEN ON YOUR PHONE" (Safeguarded Coordinates) -->
  <aside id="qr-widget" title="Scan to open translation on your phone">
    <div class="qr-frame">
      <img id="qr-img" src="" alt="Scan QR to listen on phone" />
    </div>
    <div class="qr-caption">LISTEN ON YOUR PHONE</div>
  </aside>

  <!-- Quran Ayah Fullscreen Overlay — DISABLED -->
  <div id="ayah-overlay" style="display:none !important;">
    <div class="ayah-badge">📖 Holy Quran</div>
    <div id="ayah-reference">Surah Ali 'Imran (3:102)</div>
    <div id="ayah-arabic" dir="rtl"></div>
    <div id="ayah-trans"></div>
  </div>

  <script src="display.js"></script>
</body>
</html>
